name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *" # chaque nuit à 04:17 UTC
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions
  push:
    branches: [main]
    paths: [card/update_profile.py, card/art.txt] # régénère dès que tu modifies tes infos ou ton portrait

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 card/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }} # optionnel, pour compter aussi les repos privés
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-dark.svg assets/card-light.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile card"
          git push
